version: 1

# Index config for the WKND query-index. Defines the metadata columns
# (title, image, description, template, author, publisheddate, category) the
# article-list block and the magazine/adventures listings rely on.
indices:
  # Root query index. Any published magazine article OR adventure detail page
  # (across locales, e.g. /us/en/magazine/arctic-surfing,
  # /us/en/adventures/bali-surf-camp) is automatically added here. Both listings
  # read this single /query-index.json via the article-list block and filter to
  # the folder set in their "source" config row (/us/en/magazine/ vs
  # /us/en/adventures/), so new pages appear on the right listing on their own
  # once published. The homepage "Recent Articles" list works the same way.
  articles:
    include:
      - '/*/*/magazine/**'
      - '/*/*/adventures/**'
    exclude:
      # The section landing pages themselves are not articles/adventures.
      - '/*/*/magazine'
      - '/*/*/magazine/'
      - '/*/*/adventures'
      - '/*/*/adventures/'
    target: /query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: |
          attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      template:
        select: head > meta[name="template"]
        value: |
          attribute(el, 'content')
      author:
        select: head > meta[name="author"]
        value: |
          attribute(el, 'content')
      publisheddate:
        select: head > meta[name="publisheddate"]
        value: |
          attribute(el, 'content')
      # Editorial category (Climbing/Cycling/Skiing/Surfing/Travel), published as
      # <meta name="category"> by the adventure-detail import. May be a
      # comma-separated list when an adventure belongs to more than one category.
      # Magazine articles have no category; the adventures listing builds its
      # filter tabs from this column, so category assignment stays self-updating
      # as adventures are published.
      category:
        select: head > meta[name="category"]
        value: |
          attribute(el, 'content')
      lastModified:
        select: none
        value: |
          parseTimestamp(headers['last-modified'], 'ddd, DD MMM YYYY hh:mm:ss GMT')
