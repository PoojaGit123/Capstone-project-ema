version: 1

indices:
  # Root query index. Any published magazine article (across locales, e.g.
  # /us/en/magazine/arctic-surfing) is automatically added here, which is what
  # lets the homepage "Recent Articles" list update on its own when a new
  # article ships. The article-list block reads this index and filters to the
  # folder set in its "source" config row.
  articles:
    include:
      - '/*/*/magazine/**'
    exclude:
      # The magazine landing pages themselves are not articles.
      - '/*/*/magazine'
      - '/*/*/magazine/'
    target: /query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: |
          attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      template:
        select: head > meta[name="template"]
        value: |
          attribute(el, 'content')
      author:
        select: head > meta[name="author"]
        value: |
          attribute(el, 'content')
      publisheddate:
        select: head > meta[name="publisheddate"]
        value: |
          attribute(el, 'content')
      lastModified:
        select: none
        value: |
          parseTimestamp(headers['last-modified'], 'ddd, DD MMM YYYY hh:mm:ss GMT')
